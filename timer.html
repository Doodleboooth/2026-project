<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5 Min Timer — HELPFUL</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Site CSS — timer styles are in here under "TIMER" -->
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <!-- ── NAV ──────────────────────────────────────────── -->
  <nav class="nav-bar">
    <div></div>
    <span class="nav-logo">HELPFUL</span>
    <button class="hamburger" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="side-menu" id="sideMenu">
    <button class="menu-close" id="menuClose">✕</button>
    <a href="index.html">Home</a>
    <a href="timer.html">5 Min Timer</a>
    <a href="tasks.html">Task Manager</a>
    <a href="breathing.html">Photo Booth</a>
  </div>

  <!-- ── TIMER ────────────────────────────────────────── -->
  <main class="timer-page">
    <h1 class="timer-title">5 Min Timer</h1>
    <p class="timer-sub">Five minutes is short enough that starting doesn't feel like a decision.</p>

    <!-- the ring and the digits sit on top of each other -->
    <div class="timer-dial" id="dial">
      <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
        <!-- the faint track underneath -->
        <circle class="ring-track" cx="120" cy="120" r="108"></circle>
        <!-- the coloured arc that empties as time runs out -->
        <circle class="ring-fill" id="ringFill" cx="120" cy="120" r="108"></circle>
      </svg>

      <div class="dial-face">
        <div class="time" id="time" role="timer" aria-live="off">05:00</div>
        <p class="message" id="message">Ready when you are.</p>
      </div>
    </div>

    <!-- duration controls — hidden once the clock is running -->
    <div class="adjust" id="adjust">
      <button class="adj-btn" id="minusBtn" aria-label="Less time">−</button>
      <span class="adj-label" id="adjLabel">5 minutes</span>
      <button class="adj-btn" id="plusBtn" aria-label="More time">+</button>
    </div>

    <div class="timer-presets" id="presets">
      <button class="chip" data-mins="1">1 min</button>
      <button class="chip" data-mins="5" aria-pressed="true">5 min</button>
      <button class="chip" data-mins="10">10 min</button>
      <button class="chip" data-mins="25">25 min</button>
    </div>

    <div class="timer-actions">
      <button class="bth bth-primary" id="startBtn">Start</button>
      <button class="bth bth-soft" id="resetBtn" disabled>Reset</button>
    </div>
  </main>

  <div class="booth-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Timer behaviour lives in script.js -->
  <script src="script.js?v=2" defer></script>
</body>
</html>
